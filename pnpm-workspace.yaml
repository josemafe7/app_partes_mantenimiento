# Configuración de pnpm. Va aquí y no en el campo "pnpm" de package.json porque
# pnpm 11 ya no lee ese campo. Sin "packages", el proyecto es un único paquete.

# Paquetes a los que pnpm deja ejecutar sus scripts de instalación: son
# dependencias de las herramientas (tsx, drizzle-kit, Next, ESLint).
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

# Al añadir o actualizar paquetes, pnpm no coge versiones publicadas hace menos
# de 7 días (en minutos): las versiones envenenadas de un paquete legítimo suelen
# retirarse en horas. No cambia nada de lo instalado ni toca el lockfile, y no
# afecta a Vercel (instala lo que fija pnpm-lock.yaml).
# Para un parche de seguridad urgente (de next, por ejemplo), solo en ese comando:
#   pnpm update next --config.minimumReleaseAge=0
minimumReleaseAge: 10080
